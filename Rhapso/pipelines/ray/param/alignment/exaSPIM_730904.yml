
# INTEREST POINT DETECTION
# -----------------------------------

xml_file_path_detection: '/Users/sean.fite/Desktop/dataset-kept-2-tiles.xml'
image_file_prefix: 's3://aind-open-data/exaSPIM_730904_2026-05-29_15-37-21/SPIM.ome.zarr/' 
xml_output_file_path: &detection_xml_output_file_path '/Users/sean.fite/Desktop/Rhapso-Output/rhapso-detection.xml'
n5_output_file_prefix: &n5_output_file_prefix '/Users/sean.fite/Desktop/Rhapso-Output/' 
detection_run_type: 'ray' 
file_type: 'zarr' 
dsxy: 16
dsz: 16
min_intensity: 0
max_intensity: 120
sigma: 1.8
threshold: 0.04
# sigma: 1.1
# threshold: 0.1
median_filter: 5
combine_distance: 0.5
chunks_per_bound: 8
max_spots: 2000

# SOLVER
# -----------------------------------

n5_input_path: *n5_output_file_prefix
metrics_output_path: "metrics/metrics.json"
relative_threshold: 3.5
absolute_threshold: 7.0
min_matches: 3
damp: 1.0
max_iterations: 10000
max_allowed_error: .inf
max_plateauwidth: 200
fixed_tile: False

# -- RIGID --
run_type_solver_rigid: 'rigid'
xml_file_path_solver_rigid: *detection_xml_output_file_path
xml_file_path_output_rigid: &rigid_solver_xml_output '/Users/sean.fite/Desktop/Rhapso-Output/rhapso-solver-rigid.xml'
regularization_weight_solver_rigid: 1.0

# -- AFFINE --
run_type_solver_affine: 'affine'
xml_file_path_solver_affine: *rigid_solver_xml_output
xml_file_path_output_affine: &affine_solver_xml_output '/Users/sean.fite/Desktop/Rhapso-Output/rhapso-solver-affine.xml'
regularization_weight_solver_affine: 0.05

# -- SPLIT AFFINE --
run_type_solver_split_affine: 'split-affine'
xml_file_path_solver_split_affine: '/Users/sean.fite/Desktop/Rhapso-Output/rhapso-split.xml'
xml_file_path_output_split_affine: '/Users/sean.fite/Desktop/Rhapso-Output/rhapso-solver-split-affine.xml'
regularization_weight_solver_split_affine: 0.025

# SPLIT DATASET
# -----------------------------------

xml_file_path_split: *affine_solver_xml_output
xml_output_file_path_split: &affine_split_xml_output '/Users/sean.fite/Desktop/Rhapso-Output/rhapso-split.xml'
n5_path_split: *n5_output_file_prefix
point_density: 100.0
min_points: 20
max_points: 500
error: 0.5
exclude_radius: 100.0
target_image_size: [7000, 7000, 2000]
target_overlap: [128, 128, 128]

# INTEREST POINT MATCHING
# -----------------------------------

input_type: 'zarr'
n5_matching_output_path: *n5_output_file_prefix 

# -- RIGID --
match_type_rigid: 'rigid' 
xml_file_path_matching_rigid: *detection_xml_output_file_path

# Candidates 
num_neighbors_rigid: 3
redundancy_rigid: 0
significance_rigid: 3                 
search_radius_rigid: 256
num_required_neighbors_rigid: 3

# Ransac
ransac_sample_size_rigid: 3
model_min_inliers_rigid: 25             
inlier_threshold_rigid: 128                 
min_inlier_ratio_rigid: 0.1               
num_iterations_rigid: 10000
regularization_weight_matching_rigid: 1.0

# -- AFFINE --
match_type_affine: 'affine'  
xml_file_path_matching_affine: *rigid_solver_xml_output                

# Candidates
num_neighbors_affine: 3
redundancy_affine: 0
significance_affine: 3               
search_radius_affine: 256
num_required_neighbors_affine: 3

# Ransac     
ransac_sample_size_affine: 4
model_min_inliers_affine: 40            
inlier_threshold_affine: 20               
min_inlier_ratio_affine: 0.2              
num_iterations_affine: 10000
regularization_weight_matching_affine: 0.05 

# -- SPLIT AFFINE -- 
match_type_split_affine: 'split-affine'  
xml_file_path_matching_split_affine: *affine_split_xml_output               

# Candidates
num_neighbors_split_affine: 4
redundancy_split_affine: 1
significance_split_affine: 3                  
search_radius_split_affine: 200
num_required_neighbors_split_affine: 3

# Ransac     
ransac_sample_size_split_affine: 4
model_min_inliers_split_affine: 40            
inlier_threshold_split_affine: 20              
min_inlier_ratio_split_affine: 0.2              
num_iterations_split_affine: 10000
regularization_weight_matching_split_affine: 0.025
