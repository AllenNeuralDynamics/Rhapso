
# INTEREST POINT DETECTION
# -----------------------------------

xml_file_path_detection: 's3://aind-open-data/exaSPIM_794495_2026-01-21_14-25-07_processed_2026-02-03_16-02-18/tile_alignment/rhapso/dataset.xml' 
image_file_prefix: 's3://aind-open-data/exaSPIM_794495_2026-01-21_14-25-07_processed_2026-02-03_16-02-18/flatfield_correction/SPIM.ome.zarr/'
xml_output_file_path: &detection_xml_output_file_path 's3://aind-scratch-data/sean.fite/exaSPIM_794495/rhapso-detection.xml'
n5_output_file_prefix: &n5_output_file_prefix 's3://aind-scratch-data/sean.fite/exaSPIM_794495/'
run_type: 'ray' 
file_type: 'tiff' 
dsxy: 4
dsz: 4
min_intensity: 25
max_intensity: 300
sigma: 1.4
threshold: 0.03  
median_filter: 8
combine_distance: 16
chunks_per_bound: 35
max_spots: 30000
overlap_only: True

# SOLVER
# -----------------------------------
n5_input_path: *n5_output_file_prefix
min_matches: 3
damp: 1.0
max_iterations: 10000
max_allowed_error: .inf
max_plateauwidth: 200
fixed_tile:

# -- RIGID --
run_type_solver_rigid: 'rigid'
xml_file_path_solver_rigid: *detection_xml_output_file_path
xml_file_path_output_rigid: &rigid_solver_xml_output 's3://aind-scratch-data/sean.fite/exaSPIM_794495/rhapso-solver-rigid.xml'
metrics_output_path_rigid: &rigid_solver_history_output 's3://aind-scratch-data/sean.fite/exaSPIM_794495/metrics/rigid-metrics.json'
regularization_weight_solver_rigid: 1.0
relative_threshold_rigid: 3.5
absolute_threshold_rigid: 7.0
max_cleanup_rounds_rigid: 6
min_edge_matches_rigid: 100

# -- AFFINE --
run_type_solver_affine: 'affine'
xml_file_path_solver_affine: *rigid_solver_xml_output
xml_file_path_output_affine: &affine_solver_xml_output 's3://aind-scratch-data/sean.fite/exaSPIM_794495/rhapso-solver-affine.xml'
metrics_output_path_affine: &affine_solver_history_output 's3://aind-scratch-data/sean.fite/exaSPIM_794495/metrics/affine-metrics.json'
regularization_weight_solver_affine: 0.05
relative_threshold_affine: 3.25
absolute_threshold_affine: 6.0
max_cleanup_rounds_affine: 8
min_edge_matches_affine: 150

# -- SPLIT AFFINE --
run_type_solver_split_affine: 'split-affine'
xml_file_path_solver_split_affine: 's3://aind-scratch-data/sean.fite/exaSPIM_794495/rhapso-split.xml'
xml_file_path_output_split_affine: &affine_split_solver_xml_output 's3://aind-scratch-data/sean.fite/exaSPIM_794495/rhapso-solver-split-affine.xml'
metrics_output_path_split_affine: &split_affine_solver_history_output 's3://aind-scratch-data/sean.fite/exaSPIM_794495/metrics/split-affine-metrics.json'
regularization_weight_solver_split_affine: 0.10
relative_threshold_split_affine: 3.0
absolute_threshold_split_affine: 6.0
max_cleanup_rounds_split_affine: 5
min_edge_matches_split_affine: 50

# SPLIT DATASET
# -----------------------------------

xml_file_path_split: *affine_solver_xml_output
xml_output_file_path_split: &affine_split_xml_output 's3://aind-scratch-data/sean.fite/exaSPIM_794495/rhapso-split.xml'
n5_path_split: *n5_output_file_prefix
point_density: 1.0
min_points: 20
max_points: 800
error: 0.5
exclude_radius: 100.0
target_image_size: [5000, 5000, 3400]
target_overlap: [128, 128, 128]

# INTEREST POINT MATCHING
# -----------------------------------

input_type: 'tiff'
n5_matching_output_path: *n5_output_file_prefix 

# -- RIGID --
match_type_rigid: 'rigid' 
xml_file_path_matching_rigid: *detection_xml_output_file_path

# Candidates 
num_neighbors_rigid: 3
redundancy_rigid: 0
significance_rigid: 5
search_radius_rigid: 600
num_required_neighbors_rigid: 3

# Ransac
ransac_sample_size_rigid: 3
model_min_inliers_rigid: 100
inlier_threshold_rigid: 30           
min_inlier_ratio_rigid: 0.2
num_iterations_rigid: 10000
regularization_weight_matching_rigid: 1.0

# -- AFFINE --
match_type_affine: 'affine'  
xml_file_path_matching_affine: *rigid_solver_xml_output                

# Candidates
num_neighbors_affine: 3
redundancy_affine: 0
significance_affine: 3
search_radius_affine: 100
num_required_neighbors_affine: 3

# Ransac
ransac_sample_size_affine: 6
model_min_inliers_affine: 100
inlier_threshold_affine: 20
min_inlier_ratio_affine: 0.15
num_iterations_affine: 10000
regularization_weight_matching_affine: 0.05

# -- SPLIT AFFINE -- 
match_type_split_affine: 'split-affine'  
xml_file_path_matching_split_affine: *affine_split_xml_output               

# Candidates
num_neighbors_split_affine: 3
redundancy_split_affine: 0
significance_split_affine: 3                 
search_radius_split_affine: 100
num_required_neighbors_split_affine: 3

# Ransac     
ransac_sample_size_split_affine: 6
model_min_inliers_split_affine: 12            
inlier_threshold_split_affine: 8              
min_inlier_ratio_split_affine: 0.30             
num_iterations_split_affine: 10000
regularization_weight_matching_split_affine: 0.10

# METRICS
# ----------------------------
downsample_xyz: [4.0, 4.0, 4.0]
alignment_base: *n5_output_file_prefix

# -- RIGID --
pre_xml_path_rigid: *detection_xml_output_file_path
post_xml_path_rigid: *rigid_solver_xml_output
solver_history_path_rigid: 's3://aind-scratch-data/sean.fite/exaSPIM_794495/rigid-solver_metrics.txt'
match_type_rigid: 'rigid'

# -- AFFINE --
pre_xml_path_affine: *rigid_solver_xml_output
post_xml_path_affine: *affine_solver_xml_output
solver_history_path_affine: 's3://aind-scratch-data/sean.fite/exaSPIM_794495/affine-solver_metrics.txt'
match_type_affine: 'affine'

# -- SPLIT AFFINE --
pre_xml_path_split_affine: *affine_solver_xml_output
post_xml_path_split_affine: *affine_split_solver_xml_output
split_xml_path_split_affine: *affine_split_xml_output
solver_history_path_split_affine: 's3://aind-scratch-data/sean.fite/exaSPIM_794495/split-affine-solver_metrics.txt'
match_type_split_affine: 'split-affine'
